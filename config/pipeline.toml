# Central Park Tennis Data — pipeline configuration.
# Paths are relative to the repository root unless absolute.

[inputs]
reservations_csv = "data/raw/central_park_tennis_FOIL_request.csv"
data_dictionary = "data/raw/central_park_reservation_FOIL_data_dictionary_updated.txt"
# Retrieval / extraction time is not supplied by the agency. Leave blank until confirmed.
agency_extraction_time = ""

[snapshot]
label = "foil-export-1"
# Apparent snapshot boundary (latest booking/cancellation activity in the export).
# NOT an agency-confirmed extraction timestamp. Reservation dates on or after this
# date are treated as post-snapshot and excluded from historical outcomes.
historical_outcome_cutoff = "2026-09-22"
cutoff_status = "unconfirmed"

[time]
# Provisional interpretation of the naive source timestamps.
timezone = "America/New_York"

[metrics]
walkup_cohort_version = "successful-walkup-v1"
min_dates_for_planning_target = 10

[quality]
# Screen applied to the walk-up cohort before it reaches the app (see pipeline/quality.py).
# The walk-up desk normally starts entering bookings at this time (observed in the data).
desk_open = "06:30"
grace_minutes = 10
# Dates with fewer recorded court-hours are fragments, not representative days.
min_day_court_hours = 10
# Partner records entered outside this window (minutes before start; negative = after) are dropped
# from the check-in statistics as implausible.
partner_window_minutes = [-60, 240]
# Dry days whose first walk-up entry is at or after this hour are treated as system/event days.
quiet_morning_before_hour = 9

[calendar]
# Public holidays inside the tennis season (federal, as observed). Excluded from weekday
# results by default in the app, because holiday demand looks like a weekend.
holidays = [
  "2025-05-26", "2025-06-19", "2025-07-04", "2025-09-01", "2025-10-13",
  "2026-05-25", "2026-06-19", "2026-07-03", "2026-09-07", "2026-10-12",
]

[weather]
# NOAA LCD exports for USW00094728 (Central Park). Glob; byte-identical duplicates are skipped.
lcd_glob = "data/nyc_weather/LCD_USW00094728_*.csv"
# Units chosen when the LCD file was ordered. The supplied files are METRIC (mm, degrees C).
lcd_units = "metric"
# IEM ASOS export for station NYC with valid times in America/New_York.
iem_csv = "data/NYC_weather.csv"
dry_definition_version = "dry-v1"
# Fill days after the LCD file ends from the NCEI Access Data Service
# (daily-summaries, USW00094728). Lags real time by ~a week. Raw responses cached.
ncei_fill = true
ncei_cache_dir = "data/raw/weather_cache"

[outputs]
processed_dir = "data/processed"
public_dir = "app/public/data"
